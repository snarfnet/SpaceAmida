name: SpaceAmida
options:
  bundleIdPrefix: com.amasaki
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

targets:
  SpaceAmida:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SpaceAmida
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amasaki.spaceamida
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 21
        INFOPLIST_FILE: SpaceAmida/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: 83VGKGSQUH
        CODE_SIGN_STYLE: Automatic
    info:
      path: SpaceAmida/Info.plist
      properties:
        CFBundleDisplayName: "スペースあみだ"
        CFBundleName: SpaceAmida
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSUserTrackingUsageDescription: "広告の効果測定と、より関連性の高い広告表示のために使用します。許可しなくてもアプリは使えます。"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
